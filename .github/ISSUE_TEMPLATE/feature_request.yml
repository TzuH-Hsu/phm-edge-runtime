name: Feature request
description: Propose a new capability
type: Feature

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / intent
      description: Why is this needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this be implemented? (optional)
      placeholder: Describe the approach, architecture, or user experience
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Impact and urgency
      options:
        - "p0 — Critical, drop everything"
        - "p1 — Blocking the current milestone"
        - "p2 — Important, scheduled"
        - "p3 — Nice to have / polish"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Primary domain (select all that apply)
      options:
        - label: "area:docs — Documentation and guides"
        - label: "area:skills — Skills knowledge modules"
        - label: "area:ci — CI workflows and automation"
        - label: "area:governance — Labels, templates, metadata contract, process"

  - type: checkboxes
    id: agent_eligibility
    attributes:
      label: Agent eligibility
      options:
        - label: "AI agents may pick this up (adds agent-ok)"
