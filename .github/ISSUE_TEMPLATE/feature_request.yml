name: Feature request
description: Propose a new capability
type: Feature

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / intent
      description: Why is this needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this be implemented? (optional)
      placeholder: Describe the approach, architecture, or user experience
    validations:
      required: false

  - type: textarea
    id: interface
    attributes:
      label: Interface
      description: What a developer opens and types. Optional for an idea; complete before the issue is picked up.
      placeholder: |
        1. Kinds: library class, set of functions, executable or systemd unit, CLI command, HTTP endpoint, DB migration, CI job...
        2. Location: repository path, namespace, main header and source file names
        3. Public interface: C++ header draft (classes, public method signatures, types)
        4. Error reporting: Result/expected, exception or error code, and in which situations
        5. Construction and configuration: dependencies through the constructor or a factory; paths and settings from the caller; no globals; no unlisted environment variables
        6. Lifecycle and threads: create/start/stop order; whether calls from several threads are safe
        7. Callers and callees: who calls it and when; which interfaces of other issues it calls (issue number and exact name)
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples and test data
      description: Inputs and expected results the tests use. All values invented.
      placeholder: |
        1. Example inputs and expected outputs inline (JSON, hex bytes, a message, a row)
        2. Fixture files under tests/fixtures/<name>: short ones inline, long ones with how to generate them; the acceptance criteria name the fixture each test uses
        3. At least one normal, one boundary and one error case, each written "input → expected result"
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Impact and urgency
      options:
        - "p0 — Critical, drop everything"
        - "p1 — Blocking the current milestone"
        - "p2 — Important, scheduled"
        - "p3 — Nice to have / polish"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Primary domain (select all that apply)
      options:
        - label: "area:update — Update channels, artifact delivery, atomic switch and rollback"
        - label: "area:health — Health checks, watchdog and failure recovery"
        - label: "area:queue — Disk-backed message queue"
        - label: "area:docs — Documentation and guides"
        - label: "area:ci — CI workflows and automation"
