name: Bug report
description: Report a defect
type: Bug

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the issue
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Impact and urgency
      options:
        - "p0 — Critical, drop everything"
        - "p1 — Blocking the current milestone"
        - "p2 — Important, scheduled"
        - "p3 — Nice to have / polish"
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Primary domain (select all that apply)
      options:
        - label: "area:docs — Documentation and guides"
        - label: "area:skills — Skills knowledge modules"
        - label: "area:ci — CI workflows and automation"
        - label: "area:governance — Labels, templates, metadata contract, process"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered list of actions leading to the bug
      placeholder: |
        1. Do this
        2. Then do that
        3. Observe the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen vs what actually happens
      placeholder: |
        Expected: [describe]
        Actual: [describe]
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / logs
      description: Screenshots, error messages, stack traces, or logs
      placeholder: Paste output, logs, or attach files (optional)
    validations:
      required: false
