name: Add to project

# Adds each new issue and pull request to the Project board at the URL in the
# repository variable ADD_TO_PROJECT_URL. GITHUB_TOKEN cannot reach a
# user-level board, so the action authenticates with the ADD_TO_PROJECT_PAT
# secret; the job fails until both are set. Create the secret as an Actions
# secret and as a Dependabot secret: runs triggered by Dependabot see only
# Dependabot secrets.
#
# pull_request_target, not pull_request: under pull_request a fork's pull
# request gets no secrets. This job never checks out or runs the pull
# request's code; it only passes the event to the action.

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-to-project:
    # Same runner variable as the issue labeler: an API-only job.
    runs-on: ${{ fromJSON(vars.AUTOMATION_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Add to the Project board
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: ${{ vars.ADD_TO_PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
